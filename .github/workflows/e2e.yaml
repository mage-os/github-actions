name: E2E Tests

# A reusable workflow that stands a Mage-OS store up, serves it, and points a
# browser-based test runner at it. It does not know what runner that is:
# test_command is an input.
#
# Own-repo actions are referenced by full ref, not "./": a relative path in a
# reusable workflow resolves against the caller's checkout, not this one.

on:
  workflow_call:
    inputs:
      # What to install.
      magento_version:
        required: true
        type: string
        description: "The package to install, e.g. mage-os/project-community-edition:4.0.0."
      magento_repository:
        required: false
        type: string
        default: "https://repo.mage-os.org/"
        description: "The composer repository to install it from. A release gate points this at the preview repository."
      php_version:
        required: false
        type: string
        default: "8.4"
      composer_version:
        required: false
        type: string
        default: "2.10.2"

      # What to serve it with.
      database:
        required: false
        type: string
        default: "mariadb:11.8"
      search:
        required: false
        type: string
        default: "opensearch:3.4"
      rabbitmq:
        required: false
        type: string
        default: "rabbitmq:4.2"
      redis:
        required: false
        type: string
        default: "redis:7.4"
      varnish:
        required: false
        type: string
        default: "varnish:8.0"
      static_content_themes:
        required: false
        type: string
        default: "Magento/luma Magento/backend MageOS/m137-admin-theme"
        description: >
          Space separated themes to deploy static content for. Empty deploys
          every theme, which is considerably slower.

          Both admin themes are in the default: Mage-OS renders the admin in
          MageOS/m137-admin-theme, Magento in Magento/backend, and an
          undeployed admin theme reads as a timeout or an unstyled page rather
          than as a missing deploy. A theme the store does not have deploys
          nothing and fails nothing, so one default covers both.
      backend_frontname:
        required: false
        type: string
        default: "admin"
        description: "setup:install --backend-frontname. Passed to the install and to the suite from this one place, so the two cannot disagree about the admin URL."
      disable_admin_auth_modules:
        required: false
        type: boolean
        default: true
        description: "Disable Magento_TwoFactorAuth and MageOS_PasskeyAuth so a suite can sign in to the admin; see the step for why there is no config flag. Set false for a storefront-only run."

      # Where the suite comes from. The default is the suite this repository
      # carries for its own canary; a caller with a suite of its own overrides
      # both of these.
      suite_repository:
        required: false
        type: string
        default: "mage-os/github-actions"
      suite_ref:
        required: false
        type: string
        default: "main"
      test_directory:
        required: false
        type: string
        default: "_test/demo-package/Test/e2e"
        description: "The suite's directory, relative to the root of suite_repository."

      # How to run it.
      test_command:
        required: false
        type: string
        default: "npx playwright test"
        description: >
          Run from test_directory with PLAYWRIGHT_BASE_URL set. Keep evidence
          policy (trace, video, screenshot) in the suite's own config, not in
          flags here: a CLI flag overrides the config.
      node_version:
        required: false
        type: string
        default: "22"
      fixture_profile:
        required: false
        type: string
        default: "_test/demo-package/Test/e2e/fixtures/mageos-e2e.xml"
        description: >
          A performance-toolkit profile, relative to the root of
          suite_repository, seeded before the tests run. Empty skips seeding --
          right for a suite that only asserts on what setup:install provides.

      # Housekeeping.
      timeout_minutes:
        required: false
        type: number
        default: 60
      artifact_name:
        required: false
        type: string
        default: "playwright-report"
        description: "Give this a release-specific name when several gates upload to the same run."
      artifact_retention_days:
        required: false
        type: number
        default: 30

    secrets:
      composer_auth:
        required: false

    outputs:
      base_url:
        description: "The URL the store was served on."
        value: ${{ jobs.e2e.outputs.base_url }}

jobs:
  e2e:
    name: "e2e tests"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      base_url: ${{ steps.warden.outputs.base_url }}

    env:
      TRAEFIK_DOMAIN: mageos.test
      TRAEFIK_SUBDOMAIN: app
      # The suite is checked out here, and the tests run in SUITE/<dir>.
      SUITE: suite
      # Hardcoded by warden/setup-environment's admin:user:create step, so not
      # inputs. Not secrets either -- a throwaway store for one job.
      ADMIN_USER: "admin"
      ADMIN_PASSWORD: "abcABC123"

    steps:
    # Not at the workspace root: warden/setup-environment puts the Warden CLI
    # in warden/ there, and base_directory sits exactly one level below it.
    - name: Check out the test suite
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.suite_repository }}
        ref: ${{ inputs.suite_ref }}
        path: suite

    - name: Create the Mage-OS project
      uses: mage-os/github-actions/setup-magento@main
      with:
        php-version: ${{ inputs.php_version }}
        tools: "composer:v2"
        mode: extension
        magento_repository: ${{ inputs.magento_repository }}
        magento_version: ${{ inputs.magento_version }}
        composer_auth: ${{ secrets.composer_auth }}

    - name: Serve the store in Warden
      id: warden
      uses: mage-os/github-actions/warden/setup-environment@main
      with:
        base_directory: "./_ghamagento"
        php_version: ${{ inputs.php_version }}
        composer_version: ${{ inputs.composer_version }}
        database: ${{ inputs.database }}
        search: ${{ inputs.search }}
        rabbitmq: ${{ inputs.rabbitmq }}
        redis: ${{ inputs.redis }}
        varnish: ${{ inputs.varnish }}
        run_composer_install: 1
        run_setup_install: 1
        run_admin_user_creation: 1
        varnish_as_page_cache: 1
        run_reindex: 1
        traefik_domain: ${{ env.TRAEFIK_DOMAIN }}
        traefik_subdomain: ${{ env.TRAEFIK_SUBDOMAIN }}
        backend_frontname: ${{ inputs.backend_frontname }}
        base_url: "https://${{ env.TRAEFIK_SUBDOMAIN }}.${{ env.TRAEFIK_DOMAIN }}/"
        configure_host_resolution: 1
        run_static_content_deploy: 1
        static_content_themes: ${{ inputs.static_content_themes }}

    # What run_magento_config_preset used to do, written out: one of these
    # moves the store away from what it ships as, which a gate should say
    # where the gate is defined. web/seo/use_rewrites is dropped --
    # setup:install already passed --use-rewrites=1 with a base URL given.
    - name: Configure the store the suite assumes
      working-directory: ./_ghamagento
      shell: bash
      run: |
        export WARDEN="$(dirname $(pwd))/warden/bin/warden"
        magento() { ${WARDEN} env exec -T php-fpm bin/magento "$@"; }

        # The browser speaks https to Traefik, so the store has to build https
        # links on both sides. --lock-env: this belongs to the environment.
        magento config:set --lock-env web/secure/use_in_frontend 1
        magento config:set --lock-env web/secure/use_in_adminhtml 1

        # "Add Secret Key to URLs" (XML_PATH_USE_SECURE_KEY), not the POST
        # form key -- _processUrlKeys validates that either way, so admin CSRF
        # protection stays on. With it on, as it ships, a GET to a bare admin
        # route 302s to the dashboard: a 200 no failed-request check can see.
        # Every admin spec but menu-navigation navigates by bare route.
        magento config:set admin/security/use_form_key 0

        # Off, a login terminates the account's other sessions
        # (AdminSessionsManager), and the suite shares one account across a
        # saved storageState. Upstream's integration suite sets it too.
        magento config:set admin/security/admin_account_sharing 1

        # Inherited from the preset, and a hole: the description fields ship
        # with TinyMCE, so the gate never loads the editor the admin renders.
        # Enabling it belongs in its own change, with its own run.
        magento config:set cms/wysiwyg/enabled disabled

        # The config cache was loaded before any of this was set.
        magento cache:flush

    # Separate from the test run so "never reachable" and "rendered the wrong
    # thing" are different red steps. The status is captured rather than piped
    # into head: a `run:` without `shell: bash` has no pipefail, so
    # `curl --fail | head` once reported a 404 and passed anyway.
    - name: Confirm the store answers on the resolved hostname
      shell: bash
      env:
        BASE_URL: ${{ steps.warden.outputs.base_url }}
      run: |
        STATUS="$(curl --silent --show-error --insecure --output /dev/null --write-out '%{http_code}' "$BASE_URL")"
        echo "${BASE_URL} -> ${STATUS}"

        if [ "${STATUS}" != "200" ]; then
          echo "::error::the store answered ${STATUS}, not 200 -- nothing below this ran against a working store"
          exit 1
        fi

    # Probed from the running stack, not echoed back from the inputs: a
    # version input can be a constraint, and a service tag carries no patch
    # level. A failing gate has to be able to say "it broke on OpenSearch
    # 3.3.2". Nothing here fails the job; an empty probe reports "unknown".
    - name: Record the stack under test
      id: stack
      working-directory: ./_ghamagento
      shell: bash
      env:
        BASE_URL: ${{ steps.warden.outputs.base_url }}
      run: |
        export WARDEN="$(dirname $(pwd))/warden/bin/warden"
        # Stderr is captured too: varnishd -V writes its version there.
        probe() { ${WARDEN} env exec -T "$1" "${@:2}" 2>&1 | tr -d '\r' || true; }

        RAW="$(probe php-fpm bin/magento --version | head -1)"
        echo "${RAW}"
        MAGEOS="$(printf '%s' "${RAW}" | sed -n 's/.*CLI \([0-9][^ ]*\).*/\1/p')"
        MAGENTO="$(printf '%s' "${RAW}" | sed -n 's/.*based on Magento \([0-9][^)]*\).*/\1/p')"

        PHP="$(probe php-fpm php -r 'echo PHP_VERSION;' | head -1)"
        DB="$(probe db mariadb --version | sed -n 's/.*from \([0-9][0-9.]*\).*/\1/p' | head -1)"
        SEARCH="$(probe php-fpm curl -s http://opensearch:9200 | tr -d '\n' | sed -n 's/.*"number"[^"]*"\([^"]*\)".*/\1/p')"
        REDIS="$(probe redis redis-server --version | sed -n 's/.*v=\([0-9][0-9.]*\).*/\1/p' | head -1)"
        VARNISH="$(probe varnish varnishd -V | sed -n 's/.*varnish-\([0-9][0-9.]*\).*/\1/p' | head -1)"

        # Which side owns the page cache, and whether it is caching. Magento
        # only purges Varnish when Varnish is configured as the cache, and one
        # it never invalidates passes every spec that visits a URL once, then
        # fails the first that revisits a changed page -- looking like a bug.
        FPC="$(probe php-fpm bin/magento config:show system/full_page_cache/caching_application | head -1)"
        case "${FPC}" in
          2) FPC="Varnish" ;;
          1) FPC="Magento built-in" ;;
          *) FPC="Magento built-in (unset)" ;;
        esac
        HEADERS="$(curl --silent --show-error --insecure --head "${BASE_URL}" 2>&1 | tr -d '\r' || true)"
        AGE="$(printf '%s' "${HEADERS}" | sed -n 's/^[Aa]ge: *//p' | head -1)"
        XCACHE="$(printf '%s' "${HEADERS}" | sed -n 's/^[Xx]-[Mm]agento-[Cc]ache-[Dd]ebug: *//p' | head -1)"
        CACHECONTROL="$(printf '%s' "${HEADERS}" | sed -n 's/^[Cc]ache-[Cc]ontrol: *//p' | head -1)"

        # Only the application versions reach the tests. No spec should branch
        # on a Redis patch level.
        echo "mageos=${MAGEOS:-unknown}" >> $GITHUB_OUTPUT
        echo "magento=${MAGENTO:-unknown}" >> $GITHUB_OUTPUT

        {
          echo "### Stack under test"
          echo
          echo "| | Version |"
          echo "| --- | --- |"
          echo "| Mage-OS | ${MAGEOS:-unknown} |"
          echo "| Magento | ${MAGENTO:-unknown} |"
          echo "| PHP | ${PHP:-unknown} |"
          echo "| Database | ${DB:-unknown} |"
          echo "| Search | ${SEARCH:-unknown} |"
          echo "| Redis | ${REDIS:-unknown} |"
          echo "| Varnish | ${VARNISH:-unknown} |"
          echo "| Page cache owner | ${FPC} |"
          echo "| Homepage \`Cache-Control\` | ${CACHECONTROL:-none} |"
          echo "| Homepage \`Age\` | ${AGE:-none} |"
          echo "| Homepage \`X-Magento-Cache-Debug\` | ${XCACHE:-none} |"
        } >> $GITHUB_STEP_SUMMARY

    # Magento has no switch for 2FA: force_providers is empty by default and
    # ControllerActionPredispatch still routes a fresh admin user to
    # tfa/tfa/index. Disabling the module is the only way in, and
    # MageOS_PasskeyAuth requires it, so both go in one command. The cost is
    # explicit: a run with this on does not cover admin 2FA.
    - name: Open the admin to the test suite
      if: inputs.disable_admin_auth_modules
      working-directory: ./_ghamagento
      shell: bash
      run: |
        export WARDEN="$(dirname $(pwd))/warden/bin/warden"

        MODULES=()
        for MODULE in MageOS_PasskeyAuth Magento_TwoFactorAuth; do
          # module:status exits 0 for a module that is not installed, so its
          # output is the only signal. MageOS_PasskeyAuth is Mage-OS only.
          if ${WARDEN} env exec -T php-fpm bin/magento module:status "${MODULE}" 2>&1 | grep -q 'does not exist'; then
            echo "${MODULE} is not installed"
          else
            MODULES+=("${MODULE}")
          fi
        done

        # An array, not a string: module:disable reads a space-joined string
        # as one unknown module name. Re-running it changes nothing, exits 0.
        if [ ${#MODULES[@]} -gt 0 ]; then
          ${WARDEN} env exec -T php-fpm bin/magento module:disable "${MODULES[@]}"
        fi

        # Already the default. Pinned because it gates Magento_AdminAnalytics'
        # usage-data modal, which would cover the dashboard on first sign-in.
        ${WARDEN} env exec -T php-fpm bin/magento config:set admin/usage/enabled 0

        # On by default, in after_fail mode, after three failed attempts per
        # login name -- counted in captcha_log, which survives across runs
        # against a long-lived store. A suite that asserts a bad credential is
        # refused makes exactly those failures, and the symptom is an
        # "Incorrect CAPTCHA" on a password that is correct.
        ${WARDEN} env exec -T php-fpm bin/magento config:set admin/captcha/enable 0
        ${WARDEN} env exec -T php-fpm bin/magento cache:flush

    # A bare setup:install has nothing to buy. The command reindexes itself.
    # Streamed in rather than copied: the project directories are owned by the
    # container's user.
    - name: Seed the catalog
      if: inputs.fixture_profile != ''
      working-directory: ./_ghamagento
      shell: bash
      env:
        PROFILE: ${{ github.workspace }}/${{ env.SUITE }}/${{ inputs.fixture_profile }}
      run: |
        export WARDEN="$(dirname $(pwd))/warden/bin/warden"
        ${WARDEN} env exec -T php-fpm bash -c 'cat > /tmp/fixture-profile.xml' < "${PROFILE}"
        ${WARDEN} env exec -T php-fpm bin/magento setup:performance:generate-fixtures /tmp/fixture-profile.xml

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: npm
        cache-dependency-path: ${{ env.SUITE }}/${{ inputs.test_directory }}/package-lock.json

    - name: Install the test runner
      working-directory: ${{ env.SUITE }}/${{ inputs.test_directory }}
      run: |
        npm ci
        npx playwright install --with-deps chromium

    # Through the environment rather than interpolated into the script, so the
    # quoting is bash's problem and not the expression engine's.
    - name: Run the tests
      working-directory: ${{ env.SUITE }}/${{ inputs.test_directory }}
      env:
        TEST_COMMAND: ${{ inputs.test_command }}
        PLAYWRIGHT_BASE_URL: ${{ steps.warden.outputs.base_url }}
        MAGEOS_VERSION: ${{ steps.stack.outputs.mageos }}
        MAGENTO_VERSION: ${{ steps.stack.outputs.magento }}
        MAGENTO_ADMIN_USER: ${{ env.ADMIN_USER }}
        MAGENTO_ADMIN_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        MAGENTO_ADMIN_FRONTNAME: ${{ inputs.backend_frontname }}
      run: bash -c "$TEST_COMMAND"

    # A test that fails and then passes on its retry leaves the job green, so
    # the failure() step below never runs and whatever Magento threw is lost
    # with the containers. That is how one rehearsal recorded a 500 from the
    # admin notification area with no exception to go with it. This runs
    # either way, and says so when there is nothing to report.
    - name: Report what Magento logged
      if: ${{ !cancelled() }}
      working-directory: ./_ghamagento
      shell: bash
      run: |
        export WARDEN="$(dirname $(pwd))/warden/bin/warden"
        in_php() { ${WARDEN} env exec -T php-fpm bash -c "$1" 2>/dev/null || true; }

        REPORTS="$(in_php 'ls -1 var/report 2>/dev/null | head -20')"
        if [ -n "${REPORTS}" ]; then
          for REPORT in ${REPORTS}; do
            echo "::group::var/report/${REPORT}"
            in_php "head -c 4000 var/report/${REPORT}"
            echo
            echo "::endgroup::"
          done
        else
          echo "Magento wrote no exception reports."
        fi

        EXCEPTIONS="$(in_php 'tail -n 50 var/log/exception.log 2>/dev/null')"
        if [ -n "${EXCEPTIONS}" ]; then
          echo "::group::var/log/exception.log (last 50 lines)"
          printf '%s\n' "${EXCEPTIONS}"
          echo "::endgroup::"
        fi

        # Severity-filtered: system.log is mostly INFO "Broken reference"
        # lines on any Magento install, and printing those every run would
        # bury the one entry worth reading.
        ERRORS="$(in_php 'grep -hE "\.(ERROR|CRITICAL|ALERT|EMERGENCY):" var/log/system.log 2>/dev/null | tail -n 50')"
        if [ -n "${ERRORS}" ]; then
          echo "::group::var/log/system.log (errors only)"
          printf '%s\n' "${ERRORS}"
          echo "::endgroup::"
        fi

    # What the stack was doing when something went wrong: the containers go
    # away with the runner, and nothing in the log says whether nginx was up
    # or whether Traefik had a route. Nothing here may fail the job.
    - name: Report what the stack was doing
      if: failure()
      working-directory: ./_ghamagento
      shell: bash
      run: |
        export WARDEN="$(dirname $(pwd))/warden/bin/warden"

        echo "::group::containers"
        ${WARDEN} env ps || true
        echo "::endgroup::"

        for SERVICE in nginx varnish php-fpm; do
          echo "::group::${SERVICE}"
          ${WARDEN} env logs --tail=50 "${SERVICE}" || true
          echo "::endgroup::"
        done

        # A Traefik 404 and a Magento 404 look identical from the outside, and
        # only one of them is about the store.
        echo "::group::traefik"
        ${WARDEN} svc logs --tail=50 traefik || true
        echo "::endgroup::"

    # A failing gate is read by someone deciding whether to ship, so the
    # evidence outlives the run.
    - name: Upload the test report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: |
          ${{ env.SUITE }}/${{ inputs.test_directory }}/playwright-report
          ${{ env.SUITE }}/${{ inputs.test_directory }}/test-results
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: ignore
