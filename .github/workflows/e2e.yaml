name: E2E Tests

# A reusable workflow that stands a Mage-OS store up, serves it, and points a
# browser-based test runner at it.
#
# It does not know what runner that is: test_command is an input, so a caller
# can pass grep filters, shards, a different reporter, or something that is not
# Playwright at all, without this workflow growing an input per flag.
#
# Own-repo actions are referenced by full ref rather than by "./", as
# integration.yaml and full-integration-tests.yaml do. A relative path in a
# reusable workflow resolves against the caller's checkout, which is not this
# repository when the caller is the release pipeline.

on:
  workflow_call:
    inputs:
      # What to install.
      magento_version:
        required: true
        type: string
        description: "The package to install, e.g. mage-os/project-community-edition:4.0.0."
      magento_repository:
        required: false
        type: string
        default: "https://repo.mage-os.org/"
        description: "The composer repository to install it from. A release gate points this at the preview repository."
      php_version:
        required: false
        type: string
        default: "8.4"
      composer_version:
        required: false
        type: string
        default: "2.10.2"

      # What to serve it with.
      database:
        required: false
        type: string
        default: "mariadb:11.8"
      search:
        required: false
        type: string
        default: "opensearch:3.4"
      rabbitmq:
        required: false
        type: string
        default: "rabbitmq:4.2"
      redis:
        required: false
        type: string
        default: "redis:7.4"
      varnish:
        required: false
        type: string
        default: "varnish:8.0"
      static_content_themes:
        required: false
        type: string
        default: "Magento/luma"
        description: "Space separated themes to deploy static content for. Empty deploys every theme, which is considerably slower."

      # Where the suite comes from. The default is the suite this repository
      # carries for its own canary; a caller with a suite of its own overrides
      # both of these.
      suite_repository:
        required: false
        type: string
        default: "mage-os/github-actions"
      suite_ref:
        required: false
        type: string
        default: "main"
      test_directory:
        required: false
        type: string
        default: "_test/demo-package/Test/e2e"
        description: "The suite's directory, relative to the root of suite_repository."

      # How to run it.
      test_command:
        required: false
        type: string
        default: "npx playwright test"
        description: >
          Run from test_directory with PLAYWRIGHT_BASE_URL set. Keep evidence
          policy (trace, video, screenshot) in the suite's own config rather
          than in flags here: a CLI flag overrides the config, and a gate that
          records a trace for every passing test uploads a large artifact for
          no benefit.
      node_version:
        required: false
        type: string
        default: "22"
      fixture_profile:
        required: false
        type: string
        default: "_test/demo-package/Test/e2e/fixtures/mageos-e2e.xml"
        description: >
          A performance-toolkit profile, relative to the root of
          suite_repository, seeded before the tests run. Empty skips seeding,
          which is right for a suite that asserts only on what a bare
          setup:install provides.

      # Housekeeping.
      timeout_minutes:
        required: false
        type: number
        default: 60
      artifact_name:
        required: false
        type: string
        default: "playwright-report"
        description: "Give this a release-specific name when several gates upload to the same run."
      artifact_retention_days:
        required: false
        type: number
        default: 30

    secrets:
      composer_auth:
        required: false

    outputs:
      base_url:
        description: "The URL the store was served on."
        value: ${{ jobs.e2e.outputs.base_url }}

jobs:
  e2e:
    name: "e2e tests"
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      base_url: ${{ steps.warden.outputs.base_url }}

    env:
      TRAEFIK_DOMAIN: mageos.test
      TRAEFIK_SUBDOMAIN: app
      # The suite is checked out here, and the tests run in SUITE/<dir>.
      SUITE: suite

    steps:
    # Not at the workspace root: warden/setup-environment checks the Warden CLI
    # out into warden/ there, and base_directory has to sit exactly one level
    # below it.
    - name: Check out the test suite
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.suite_repository }}
        ref: ${{ inputs.suite_ref }}
        path: suite

    - name: Create the Mage-OS project
      uses: mage-os/github-actions/setup-magento@main
      with:
        php-version: ${{ inputs.php_version }}
        tools: "composer:v2"
        mode: extension
        magento_repository: ${{ inputs.magento_repository }}
        magento_version: ${{ inputs.magento_version }}
        composer_auth: ${{ secrets.composer_auth }}

    - name: Serve the store in Warden
      id: warden
      uses: mage-os/github-actions/warden/setup-environment@main
      with:
        base_directory: "./_ghamagento"
        php_version: ${{ inputs.php_version }}
        composer_version: ${{ inputs.composer_version }}
        database: ${{ inputs.database }}
        search: ${{ inputs.search }}
        rabbitmq: ${{ inputs.rabbitmq }}
        redis: ${{ inputs.redis }}
        varnish: ${{ inputs.varnish }}
        run_composer_install: 1
        run_setup_install: 1
        run_admin_user_creation: 1
        run_magento_config_preset: 1
        run_reindex: 1
        traefik_domain: ${{ env.TRAEFIK_DOMAIN }}
        traefik_subdomain: ${{ env.TRAEFIK_SUBDOMAIN }}
        base_url: "https://${{ env.TRAEFIK_SUBDOMAIN }}.${{ env.TRAEFIK_DOMAIN }}/"
        configure_host_resolution: 1
        run_static_content_deploy: 1
        static_content_themes: ${{ inputs.static_content_themes }}

    # Separate from the test run so that "the store was never reachable" and
    # "the store rendered the wrong thing" are different red steps.
    - name: Confirm the store answers on the resolved hostname
      env:
        BASE_URL: ${{ steps.warden.outputs.base_url }}
      run: curl --silent --show-error --fail --insecure --head "$BASE_URL" | head -1

    # A bare setup:install has nothing to buy. The command reindexes itself.
    # Streamed in rather than copied: the project directories are owned by the
    # container's user.
    - name: Seed the catalog
      if: inputs.fixture_profile != ''
      working-directory: ./_ghamagento
      shell: bash
      env:
        PROFILE: ${{ github.workspace }}/${{ env.SUITE }}/${{ inputs.fixture_profile }}
      run: |
        export WARDEN="$(dirname $(pwd))/warden/bin/warden"
        ${WARDEN} env exec -T php-fpm bash -c 'cat > /tmp/fixture-profile.xml' < "${PROFILE}"
        ${WARDEN} env exec -T php-fpm bin/magento setup:performance:generate-fixtures /tmp/fixture-profile.xml

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node_version }}
        cache: npm
        cache-dependency-path: ${{ env.SUITE }}/${{ inputs.test_directory }}/package-lock.json

    - name: Install the test runner
      working-directory: ${{ env.SUITE }}/${{ inputs.test_directory }}
      run: |
        npm ci
        npx playwright install --with-deps chromium

    # The command arrives through the environment rather than interpolated into
    # the script, so its quoting is bash's problem and not the expression
    # engine's.
    - name: Run the tests
      working-directory: ${{ env.SUITE }}/${{ inputs.test_directory }}
      env:
        TEST_COMMAND: ${{ inputs.test_command }}
        PLAYWRIGHT_BASE_URL: ${{ steps.warden.outputs.base_url }}
      run: bash -c "$TEST_COMMAND"

    # A failing gate is read by someone deciding whether to ship, so the
    # evidence has to outlive the run.
    - name: Upload the test report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: |
          ${{ env.SUITE }}/${{ inputs.test_directory }}/playwright-report
          ${{ env.SUITE }}/${{ inputs.test_directory }}/test-results
        retention-days: ${{ inputs.artifact_retention_days }}
        if-no-files-found: ignore
