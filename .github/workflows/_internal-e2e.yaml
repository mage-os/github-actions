name: E2E Test

on:
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - "_test/demo-package/Test/e2e/**"
    - "warden/**"
    - "setup-magento/**"
    - ".github/workflows/_internal-e2e.yaml"
    - "!(**/*.md)"
  pull_request:
    branches:
    - main
    paths:
    - "_test/demo-package/Test/e2e/**"
    - "warden/**"
    - "setup-magento/**"
    - ".github/workflows/_internal-e2e.yaml"
    - "!(**/*.md)"

# Standing up the whole stack costs a runner for a while; there is no reason to
# keep paying for a run whose commit has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storefront-smoke-test:
    name: "storefront tests"
    if: "!startsWith(github.head_ref, 'release-please')"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # setup:install, the hostname the runner resolves and the URL the browser
      # opens all have to agree, so they are derived from one place.
      TRAEFIK_DOMAIN: mageos.test
      TRAEFIK_SUBDOMAIN: app
      E2E_DIRECTORY: actions/_test/demo-package/Test/e2e
      # Pinned rather than taken from supported-version: this workflow is here
      # to tell us whether the action still serves a store, so a service bump
      # elsewhere should not change what it reports. The release pipeline picks
      # its own versions.
      PHP_VERSION: "8.4"
      COMPOSER_VERSION: "2.10.2"
    steps:
    # Not at the workspace root: warden/setup-environment checks the Warden
    # CLI out into warden/ there, which is where this repository keeps that
    # action, and the checkout would land on top of it.
    - uses: actions/checkout@v6
      with:
        path: actions

    # mode: extension is how the other internal workflows get a project onto
    # disk -- composer create-project --no-install, into ./_ghamagento. The
    # dependencies are then installed inside the container, by the PHP version
    # that will serve them.
    - name: Create the Mage-OS project
      uses: ./actions/setup-magento
      with:
        php-version: ${{ env.PHP_VERSION }}
        tools: "composer:v2"
        mode: extension
        magento_repository: "https://repo.mage-os.org/"
        magento_version: "mage-os/project-community-edition:4.0.0"

    - name: Serve the store in Warden
      id: warden
      uses: ./actions/warden/setup-environment
      with:
        base_directory: "./_ghamagento"
        php_version: ${{ env.PHP_VERSION }}
        composer_version: ${{ env.COMPOSER_VERSION }}
        database: "mariadb:11.8"
        search: "opensearch:3.4"
        rabbitmq: "rabbitmq:4.2"
        redis: "redis:7.4"
        varnish: "varnish:8.0"
        run_composer_install: 1
        run_setup_install: 1
        run_admin_user_creation: 1
        run_magento_config_preset: 1
        run_reindex: 1
        traefik_domain: ${{ env.TRAEFIK_DOMAIN }}
        traefik_subdomain: ${{ env.TRAEFIK_SUBDOMAIN }}
        # The three inputs a browser needs, and nothing a PHPUnit suite pays for.
        base_url: "https://${{ env.TRAEFIK_SUBDOMAIN }}.${{ env.TRAEFIK_DOMAIN }}/"
        configure_host_resolution: 1
        run_static_content_deploy: 1
        static_content_themes: "Magento/luma"

    # Separate from the test run so that "the store was never reachable" and
    # "the store rendered the wrong thing" are different red steps.
    - name: Confirm the store answers on the resolved hostname
      env:
        BASE_URL: ${{ steps.warden.outputs.base_url }}
      run: curl --silent --show-error --fail --insecure --head "$BASE_URL" | head -1

    # What the gate ran against, probed from the running stack rather than
    # echoed back from the inputs: a version input can be a constraint, the
    # repository can resolve it differently than expected, and a service tag
    # does not carry its patch level. A failing release gate has to be able to
    # say "it broke on OpenSearch 3.3.2", not "we asked for 3.3".
    #
    # Nothing here can fail the job. A probe that comes back empty reports
    # "unknown" -- a disabled service is not a broken store.
    - name: Record the stack under test
      id: stack
      working-directory: ./_ghamagento
      shell: bash
      run: |
        export WARDEN="$(dirname $(pwd))/warden/bin/warden"
        # Stderr is captured too: varnishd -V writes its version there.
        probe() { ${WARDEN} env exec -T "$1" "${@:2}" 2>&1 | tr -d '\r' || true; }

        RAW="$(probe php-fpm bin/magento --version | head -1)"
        echo "${RAW}"
        MAGEOS="$(printf '%s' "${RAW}" | sed -n 's/.*CLI \([0-9][^ ]*\).*/\1/p')"
        MAGENTO="$(printf '%s' "${RAW}" | sed -n 's/.*based on Magento \([0-9][^)]*\).*/\1/p')"

        PHP="$(probe php-fpm php -r 'echo PHP_VERSION;' | head -1)"
        DB="$(probe db mariadb --version | sed -n 's/.*from \([0-9][0-9.]*\).*/\1/p' | head -1)"
        SEARCH="$(probe php-fpm curl -s http://opensearch:9200 | tr -d '\n' | sed -n 's/.*"number"[^"]*"\([^"]*\)".*/\1/p')"
        REDIS="$(probe redis redis-server --version | sed -n 's/.*v=\([0-9][0-9.]*\).*/\1/p' | head -1)"
        VARNISH="$(probe varnish varnishd -V | sed -n 's/.*varnish-\([0-9][0-9.]*\).*/\1/p' | head -1)"

        # Only the application versions reach the tests. A spec may reasonably
        # branch on those; none should branch on a Redis patch level.
        echo "mageos=${MAGEOS:-unknown}" >> $GITHUB_OUTPUT
        echo "magento=${MAGENTO:-unknown}" >> $GITHUB_OUTPUT

        {
          echo "### Stack under test"
          echo
          echo "| | Version |"
          echo "| --- | --- |"
          echo "| Mage-OS | ${MAGEOS:-unknown} |"
          echo "| Magento | ${MAGENTO:-unknown} |"
          echo "| PHP | ${PHP:-unknown} |"
          echo "| Database | ${DB:-unknown} |"
          echo "| Search | ${SEARCH:-unknown} |"
          echo "| Redis | ${REDIS:-unknown} |"
          echo "| Varnish | ${VARNISH:-unknown} |"
        } >> $GITHUB_STEP_SUMMARY

    # A bare setup:install has nothing to buy. The command reindexes itself.
    # Streamed in rather than copied: the project directories are owned by the
    # container's user.
    - name: Seed the catalog
      working-directory: ./_ghamagento
      shell: bash
      env:
        PROFILE: ${{ github.workspace }}/${{ env.E2E_DIRECTORY }}/fixtures/mageos-e2e.xml
      run: |
        export WARDEN="$(dirname $(pwd))/warden/bin/warden"
        ${WARDEN} env exec -T php-fpm bash -c 'cat > /tmp/mageos-e2e.xml' < "${PROFILE}"
        ${WARDEN} env exec -T php-fpm bin/magento setup:performance:generate-fixtures /tmp/mageos-e2e.xml

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: ${{ env.E2E_DIRECTORY }}/package-lock.json

    - name: Install Playwright
      working-directory: ${{ env.E2E_DIRECTORY }}
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Run the storefront tests
      working-directory: ${{ env.E2E_DIRECTORY }}
      env:
        PLAYWRIGHT_BASE_URL: ${{ steps.warden.outputs.base_url }}
        MAGEOS_VERSION: ${{ steps.stack.outputs.mageos }}
        MAGENTO_VERSION: ${{ steps.stack.outputs.magento }}
      run: npx playwright test

    - name: Upload the Playwright report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          ${{ env.E2E_DIRECTORY }}/playwright-report
          ${{ env.E2E_DIRECTORY }}/test-results
        retention-days: 30
        if-no-files-found: ignore
