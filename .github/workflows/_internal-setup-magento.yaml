name: Setup Magento Test

on:
  workflow_dispatch: {}
  push:
    branches:
    - main
    paths:
    - "setup-magento/**"
    - ".github/workflows/_internal-setup-magento.yaml"
    - "supported-version/**"
    - "!(**/*.md)"
  pull_request:
    branches:
    - main
    paths:
    - "setup-magento/**"
    - ".github/workflows/_internal-setup-magento.yaml"
    - "supported-version/**"
    - "!(**/*.md)"

env:
  PSEUDO_REPO_FOLDER: ../magento_repo
  magento_folder: ../magento2

jobs:
  compute_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.supported-version.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./supported-version
        with:
          kind: currently-supported
        id: supported-version
      - run: echo ${{ steps.supported-version.outputs.matrix }}

  setup-magento-store:
    needs: compute_matrix
    strategy:
      matrix: ${{ fromJSON(needs.compute_matrix.outputs.matrix) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - run: |
        PSEUDO_STORE_FULL_PATH=$(realpath "${{ env.PSEUDO_REPO_FOLDER }}")
        echo "PSEUDO_STORE_FULL_PATH=$PSEUDO_STORE_FULL_PATH" >> $GITHUB_ENV
      name: Generate Full Pseudo Store Path
      shell: bash

    - name: Set PHP Version
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        tools: composer:v${{ matrix.composer }}

    - uses: actions/cache@v4
      id: setup-magento-store-cache
      with:
        key: setup-magento-ci | ${{ runner.os }} | ${{ matrix.magento }}
        path: ${{ env.PSEUDO_STORE_FULL_PATH }}

    - run: composer create-project --repository-url="https://mirror.mage-os.org" "${{ matrix.magento }}" "${{ env.PSEUDO_REPO_FOLDER }}" --no-install
      name: Create Store to simulate a real Magento store in a real repo.
      if: steps.setup-magento-store-cache.outputs.cache-hit != 'true'

    - uses: ./fix-magento-install
      name: Fix Magento Out of Box Install Issues
      with:
        magento_directory: ${{ env.PSEUDO_REPO_FOLDER }}
      if: steps.setup-magento-store-cache.outputs.cache-hit != 'true'

    # Ignore only the advisories this version cannot resolve; see advisory-affected.ts.
    - run: |
        ids="${{ matrix.advisoryIgnoreIds }}"
        if composer config --no-interaction policy.advisories.ignore-id $ids >/dev/null 2>&1; then
          echo "Ignoring advisories via policy.advisories.ignore-id: $ids"
        elif composer config --no-interaction audit.ignore $ids >/dev/null 2>&1; then
          echo "Ignoring advisories via audit.ignore: $ids"
        else
          echo "This Composer version does not block advisory-affected versions; nothing to do"
        fi
      name: Ignore advisories that this version cannot resolve
      shell: bash
      working-directory: "${{ env.PSEUDO_REPO_FOLDER }}"
      if: ${{ matrix.advisoryIgnoreIds != '' && steps.setup-magento-store-cache.outputs.cache-hit != 'true' }}

    - run: composer install
      shell: bash
      working-directory: "${{ env.PSEUDO_REPO_FOLDER }}"
      if: steps.setup-magento-store-cache.outputs.cache-hit != 'true'

    - run: git init && git config user.email "you@example.com" && git config user.name "Your Name" && git add . && git commit -m "init" && git clean -fdx
      working-directory: "${{ env.PSEUDO_REPO_FOLDER }}"
      if: steps.setup-magento-store-cache.outputs.cache-hit != 'true'

    - run: cp -R ${{ env.PSEUDO_REPO_FOLDER }} ${{ env.magento_folder }}
      shell: bash

    - uses: ./setup-magento
      id: setup-magento
      with:
        php-version: ${{ matrix.php }}
        tools: composer:v${{ matrix.composer }}
        mode: store
        working-directory: ${{ env.magento_folder }}
    
    - uses: mage-os/github-actions/cache-magento@main
      with:
        composer_cache_key:  '${{ matrix.magento }}'

    # Ignore only the advisories this version cannot resolve; see advisory-affected.ts.
    - run: |
        ids="${{ matrix.advisoryIgnoreIds }}"
        if composer config --no-interaction policy.advisories.ignore-id $ids >/dev/null 2>&1; then
          echo "Ignoring advisories via policy.advisories.ignore-id: $ids"
        elif composer config --no-interaction audit.ignore $ids >/dev/null 2>&1; then
          echo "Ignoring advisories via audit.ignore: $ids"
        else
          echo "This Composer version does not block advisory-affected versions; nothing to do"
        fi
      name: Ignore advisories that this version cannot resolve
      shell: bash
      working-directory: ${{ steps.setup-magento.outputs.path }}
      if: ${{ matrix.advisoryIgnoreIds != '' }}

    - run: composer install
      name: Composer install
      shell: bash
      working-directory: ${{ steps.setup-magento.outputs.path }}

  setup-magento-extension:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4 

    - uses: ./setup-magento
      id: setup-magento
      with:
        php-version: 8.3
        tools: composer:v2
        mode: extension
        magento_version: magento/project-community-edition:2.4.7-p4

    - uses: mage-os/github-actions/cache-magento@main
      with:
        mode: 'extension'
        composer_cache_key: 'magento/project-community-edition:2.4.7-p4'

    # This job pins one version instead of taking a matrix, so the advisory ids come from a
    # single-entry matrix rather than matrix.advisoryIgnoreIds. advisory-affected.ts stays the
    # only place the exemption is recorded.
    - uses: ./supported-version
      id: advisories
      with:
        kind: custom
        custom_versions: magento/project-community-edition:2.4.7-p4

    - run: |
        ids="${{ fromJSON(steps.advisories.outputs.matrix).include[0].advisoryIgnoreIds }}"
        if composer config --no-interaction policy.advisories.ignore-id $ids >/dev/null 2>&1; then
          echo "Ignoring advisories via policy.advisories.ignore-id: $ids"
        elif composer config --no-interaction audit.ignore $ids >/dev/null 2>&1; then
          echo "Ignoring advisories via audit.ignore: $ids"
        else
          echo "This Composer version does not block advisory-affected versions; nothing to do"
        fi
      name: Ignore advisories that this version cannot resolve
      shell: bash
      working-directory: ${{ steps.setup-magento.outputs.path }}
      if: ${{ fromJSON(steps.advisories.outputs.matrix).include[0].advisoryIgnoreIds != '' }}
    
    - run: composer install
      name: Composer install
      shell: bash
      working-directory: ${{ steps.setup-magento.outputs.path }}
